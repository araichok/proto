syntax = "proto3";

package proto.inventory;

option go_package = "github.com/araichok/proto_pb1/inventory;inventory";

message Product {
  // client id
  string ID = 1;
  // client full name
  string Name = 2;
  // email
  string Description = 3;
  // phone
  uint64 Price = 4;
  // created at == registration time for a client
  uint64 Stock = 5;
  // check client status
  string Category = 6;
}
